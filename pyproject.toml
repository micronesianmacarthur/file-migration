[project]
name = "servarr-migration"
version = "0.1.0"
description = "Copy files from a source directory to a target directory while preserving the source folder structure."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "tqdm>=4.70.1",
]

[project.scripts]
servarr-migration = "servarr_migration.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/servarr_migration"]
